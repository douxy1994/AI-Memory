      <stop offset="0.5" stop-color="#f6f4ea"/>
      <stop offset="1" stop-color="#e9f5f0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80dfae"/>
      <stop offset="0.5" stop-color="#21b978"/>
      <stop offset="1" stop-color="#087d51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#143b2d" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#60d79f" opacity=".13"/>
  <circle cx="80" cy="565" r="150" fill="#fff" opacity=".65"/>
