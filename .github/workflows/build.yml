name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test SwiftUI and AppKit app
        run: |
          xcodebuild \
            -project AIMemory.xcodeproj \
            -scheme AIMemory \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build Release app
        run: |
          xcodebuild \
            -project AIMemory.xcodeproj \
            -scheme AIMemory \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  windows:
    name: Windows 11 native
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify Windows localization resources
        run: node Windows/scripts/verify-localization.mjs
      - name: Test Windows core
        run: dotnet test Windows/tests/AIMemory.Core.Tests/AIMemory.Core.Tests.csproj --configuration Release
      - name: Build WinUI 3 x64
        run: dotnet build Windows/src/AIMemory.Windows/AIMemory.Windows.csproj --configuration Release -p:Platform=x64
      - name: Build WinUI 3 ARM64
        run: dotnet build Windows/src/AIMemory.Windows/AIMemory.Windows.csproj --configuration Release -p:Platform=ARM64
      - name: Smoke test packaged MCP helper
        shell: pwsh
        run: |
          $helper = Get-ChildItem `
            Windows/src/AIMemory.Windows/bin `
            -Recurse -Filter aimemory-mcp.exe |
            Where-Object FullName -Match '\\x64\\' |
            Select-Object -First 1
          if (-not $helper) {
            throw "Packaged aimemory-mcp.exe was not found."
          }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          )
          $responses = $requests | & $helper.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "aimemory-mcp.exe exited with code $LASTEXITCODE."
          }
          $initialize = $responses[0] | ConvertFrom-Json
          $tools = $responses[1] | ConvertFrom-Json
          if ($initialize.result.serverInfo.name -ne "aimemory") {
            throw "MCP initialize response is invalid."
          }
          if ($initialize.result.protocolVersion -ne "2025-03-26") {
            throw "MCP protocol version is not aligned with the macOS helper."
          }
          $toolNames = @($tools.result.tools | ForEach-Object name)
          foreach ($required in @(
            "get_repo_memory",
            "get_project_context",
            "get_repo_memory_health",
            "import_all_local_history",
            "scan_repo_conversations",
            "merge_repo_alias",
            "search_repo_history",
            "read_history_conversation",
            "create_memory_candidate",
            "propose_memory_merge",
            "list_memory_candidates",
            "create_checkpoint",
            "build_handoff_packet",
            "list_active_runs",
            "list_run_artifacts",
            "resume_from_checkpoint",
            "list_repo_wiki_pages",
            "rebuild_repo_wiki",
            "rebuild_repo_embeddings",
            "list_memory_conflicts",
            "list_entity_graph",
            "detect_agent_integrations"
          )) {
            if ($required -notin $toolNames) {
              throw "MCP tool is missing: $required"
            }
          }
      - name: Build, install and smoke test signed MSIX desktop lifecycle
        shell: pwsh
        run: |
          $passwordText = "aimemory-ci-package-password"
          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=AI Memory" `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -FriendlyName "AI Memory CI package" `
            -CertStoreLocation Cert:\CurrentUser\My
          $pfx = Join-Path $env:RUNNER_TEMP "aimemory-ci-package.pfx"
          Export-PfxCertificate `
            -Cert $certificate `
            -FilePath $pfx `
            -Password $password | Out-Null
          Export-Certificate `
            -Cert $certificate `
            -FilePath (Join-Path $env:RUNNER_TEMP "aimemory-ci-package.cer") |
            Out-Null
          Import-Certificate `
            -FilePath (Join-Path $env:RUNNER_TEMP "aimemory-ci-package.cer") `
            -CertStoreLocation Cert:\CurrentUser\TrustedPeople |
            Out-Null
          Import-Certificate `
            -FilePath (Join-Path $env:RUNNER_TEMP "aimemory-ci-package.cer") `
            -CertStoreLocation Cert:\CurrentUser\Root |
            Out-Null
          dotnet build `
            Windows/src/AIMemory.Windows/AIMemory.Windows.csproj `
            --configuration Release `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=$($certificate.Thumbprint) `
            -p:PackageCertificateKeyFile=$pfx `
            -p:PackageCertificatePassword=$passwordText
          $package = Get-ChildItem `
            Windows/src/AIMemory.Windows/bin `
            -Recurse -Filter *.msix |
            Where-Object FullName -Match '\\x64\\' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $package) {
            throw "AIMemory.Windows.msix was not found in the build output."
          }
          Add-AppxPackage -Path $package.FullName -ForceUpdateFromAnyVersion
          $installed = Get-AppxPackage -Name "com.aimemory.windows" |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $installed) {
            throw "The AI Memory MSIX package was not installed."
          }
          $appId = "$($installed.PackageFamilyName)!App"
          try {
            pwsh ./Windows/scripts/smoke-desktop.ps1 `
              -AppUserModelId $appId `
              -ProcessName "AIMemory.Windows"
          }
          finally {
            Remove-AppxPackage -Package $installed.PackageFullName `
              -ErrorAction SilentlyContinue
          }
